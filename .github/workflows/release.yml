name: Build agyline artifacts (manual only)

# No tag trigger, release creation, registry credentials or package publication.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build agyline for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            executable: agyline
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            executable: agyline.exe
          - target: x86_64-apple-darwin
            os: macos-latest
            executable: agyline
          - target: aarch64-apple-darwin
            os: macos-latest
            executable: agyline

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build agyline with the lockfile
        run: cargo build --release --locked --bin agyline --target ${{ matrix.target }}

      - name: Upload agyline workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: agyline-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.executable }}
          if-no-files-found: error
