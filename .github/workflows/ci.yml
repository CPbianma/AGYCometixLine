name: agyline CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Formatting and Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy with the lockfile
        run: cargo clippy --locked --all-targets -- -D warnings

  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests with the lockfile
        run: cargo test --locked --all-targets

      - name: Install Python for isolated verifier regressions
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test opt-in verification helpers without user settings
        run: python -m unittest discover -s scripts -p test_verification.py -v

      - name: Build agyline with the lockfile
        run: cargo build --release --locked --bin agyline
